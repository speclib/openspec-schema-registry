<style>
  :root {
    --blue: #2E74FC; --ink: #101214; --muted: #5b6470; --paper: #f5f6f7; --line: #d9dde2;
    --sky-top: #e9edf1; --sky-bottom: #f7f8f9;
    --ridge-1: #c9d1d9; --ridge-2: #aeb9c4; --ridge-3: #8795a3; --ridge-4: #5f6d7b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f4f5f6; --muted: #939ca6; --paper: #15181b; --line: #2a2f35;
      --sky-top: #1b2229; --sky-bottom: #283341;
      --ridge-1: #2c3845; --ridge-2: #222c37; --ridge-3: #19212a; --ridge-4: #11171d;
    }
    :root:not([data-theme="light"]) .logo-light { display: none; }
    :root:not([data-theme="light"]) .logo-dark { display: block; }
  }
  :root[data-theme="dark"] {
    --ink: #f4f5f6; --muted: #939ca6; --paper: #15181b; --line: #2a2f35;
    --sky-top: #1b2229; --sky-bottom: #283341;
    --ridge-1: #2c3845; --ridge-2: #222c37; --ridge-3: #19212a; --ridge-4: #11171d;
  }
  :root[data-theme="dark"] .logo-light { display: none; }
  :root[data-theme="dark"] .logo-dark { display: block; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }

  .hero {
    position: relative; flex: 1; min-height: 480px;
    display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%);
  }
  .range { position: absolute; inset: auto 0 0 0; width: 100%; height: 62%; }
  .brand { position: relative; text-align: center; padding: 0 1.25rem 14vh; }
  .brand img { width: min(384px, 80vw); height: auto; margin: 0 auto; }
  .logo-dark { display: none; }
  .soon { margin: 2.25rem 0 0; font-size: 1.05rem; color: var(--ink); }
  .soon a { text-decoration-color: var(--blue); text-underline-offset: .2em; }
  .soon a:hover { color: var(--blue); }

  footer {
    padding: 1.1rem 1.5rem 1.5rem;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem;
    font-size: .9rem; color: var(--muted); border-top: 1px solid var(--line);
  }
  footer nav { display: flex; gap: 1.5rem; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--blue); }
</style>
</head>
